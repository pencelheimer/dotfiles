- plugins:
    - plugins/dotbot-omnipkg/omnipkg.py
    - plugins/dotbot-include/include.py

- defaults:
    link:
      create: true
      relink: true
      force: true

- clean:
    ~/.config:
      recursive: true
    ~/:

- omnipkg:
    install:
      - bitwarden
      - telegram-desktop
      - noctalia

- include: config/awww/dotbot-awww.yaml
- include: config/btop/dotbot-btop.yaml
